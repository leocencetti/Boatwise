<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>⛵ Boatwise</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header id="app-header">
            <h1>⛵ Boatwise</h1>
        </header>

        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="setup-section">
                <h2>Filtri Quiz</h2>
                <button id="open-filter-btn" class="btn btn-secondary" style="width: 100%;">Seleziona Capitoli/Temi/Voci</button>
            </div>

            <div class="setup-section">
                <h2>Ordine</h2>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="quiz-order" value="sequential" checked>
                        Sequenziale
                    </label>
                    <label>
                        <input type="radio" name="quiz-order" value="random">
                        Casuale
                    </label>
                    <label>
                        <input type="radio" name="quiz-order" value="spaced-repetition">
                        Ripetizione Spaziata
                    </label>
                </div>
            </div>

            <div class="setup-navigation">
                <button id="reset-cache-btn" class="btn btn-secondary" style="flex: 1;">Reset Risposte</button>
                <button id="start-quiz-btn" class="btn btn-primary" style="flex: 1;">Inizia Quiz</button>
            </div>
        </div>

        <!-- Filter Modal -->
        <div id="filter-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Seleziona Capitoli, Temi e Voci</h2>
                    <button id="close-filter-btn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="filter-actions">
                        <button id="select-all-btn" class="btn btn-secondary btn-small">Seleziona Tutto</button>
                        <button id="deselect-all-btn" class="btn btn-secondary btn-small">Deseleziona Tutto</button>
                    </div>
                    <div id="filter-tree" class="filter-tree">
                        <!-- Filter checkboxes will be dynamically inserted here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="apply-filter-btn" class="btn btn-primary">Applica Filtri</button>
                </div>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <div class="quiz-info">
                    <span id="quiz-counter">Quiz 1 / 100</span>
                    <span id="quiz-id" class="quiz-id">ID: 1</span>
                </div>
                <button id="back-to-setup-btn" class="btn btn-secondary">Torna alla Selezione</button>
            </div>

            <div class="quiz-content">
                <div id="quiz-image-container" class="quiz-image-container hidden">
                    <img id="quiz-image" alt="Quiz Image">
                </div>

                <div class="quiz-question">
                    <p id="quiz-question-text"></p>
                </div>

                <div id="quiz-answers" class="quiz-answers">
                    <!-- Answers will be dynamically inserted here -->
                </div>
            </div>

            <div class="quiz-navigation">
                <button id="prev-btn" class="btn btn-secondary">← Precedente</button>
                <button id="next-btn" class="btn btn-primary" disabled>Successivo →</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
